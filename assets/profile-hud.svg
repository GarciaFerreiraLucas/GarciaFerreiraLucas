    <text x="48" y="266.0" class="ascii-row" xml:space="preserve">        ,   `;+~,    .~f!L80t~tCGGLf        </text>
    <text x="48" y="275.2" class="ascii-row" xml:space="preserve">         :  .,;,'    ':~tfLCL!ifGCt         </text>
    <text x="48" y="284.4" class="ascii-row" xml:space="preserve">            .,`    ',+ttLLft:,+LCti         </text>
    <text x="48" y="293.6" class="ascii-row" xml:space="preserve">          '  `,`    ,~tCLt!~+:+L!i+         </text>
    <text x="48" y="302.8" class="ascii-row" xml:space="preserve">          ~   `;:  `:~+!!tfGG!tfi;          </text>
    <text x="48" y="312.0" class="ascii-row" xml:space="preserve">           ,   ,:' .,;~+!LG0C!++:+          </text>
    <text x="48" y="321.2" class="ascii-row" xml:space="preserve">                ',`,;~+!LGGGi:``it          </text>
    <text x="48" y="330.4" class="ascii-row" xml:space="preserve">                 '~;+!fLGCL!: 'iGt          </text>
    <text x="48" y="339.6" class="ascii-row" xml:space="preserve">            .     ..,;;:i+~,.`!CGt          </text>
    <text x="48" y="348.8" class="ascii-row" xml:space="preserve">            '        . .`...;fCGGLft        </text>
      </g>

      <!-- Laser Scanner Beam Sweeping Across ASCII Face -->
      <g class="laser-beam">
        <rect x="0" y="10" width="275" height="6" fill="url(#scan-laser)" />
        <line x1="0" y1="13" x2="275" y2="13" stroke="#38bdf8" stroke-width="1.2" filter="url(#laser-glow)" />
      </g>
    </g>

    <!-- Dynamic Stack Ticker Box (Under ASCII Face) -->
    <rect x="0" y="306" width="275" height="46" rx="5" fill="#0d1017" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
    <text x="12" y="322" fill="#a855f7" font-size="8.5" font-weight="700" letter-spacing="1">CURRENT_STACK_SYNC:</text>

    <!-- Phase 1: Java & Spring -->
    <g style="animation: cycleStack1 8s infinite;">
      <text x="12" y="340" fill="#38bdf8" font-size="11" font-weight="700">JAVA // SPRING BOOT</text>
      <text x="210" y="340" fill="#34d399" font-size="8.5" font-weight="600">[BACKEND]</text>
    </g>

    <!-- Phase 2: Next.js & React -->
    <g style="animation: cycleStack2 8s infinite;">
      <text x="12" y="340" fill="#38bdf8" font-size="11" font-weight="700">NEXT.JS 14 // REACT 19</text>
      <text x="206" y="340" fill="#38bdf8" font-size="8.5" font-weight="600">[FRONTEND]</text>
    </g>

    <!-- Phase 3: Go & Distributed Data -->
    <g style="animation: cycleStack3 8s infinite;">
      <text x="12" y="340" fill="#38bdf8" font-size="11" font-weight="700">GO // POSTGRES // KAFKA</text>
      <text x="216" y="340" fill="#fbbf24" font-size="8.5" font-weight="600">[DATA]</text>
    </g>

    <!-- Phase 4: Docker & Infrastructure -->
    <g style="animation: cycleStack4 8s infinite;">
      <text x="12" y="340" fill="#38bdf8" font-size="11" font-weight="700">DOCKER // PROXMOX // DTI</text>
      <text x="218" y="340" fill="#f43f5e" font-size="8.5" font-weight="600">[INFRA]</text>
    </g>

    <!-- Biometric Status Strip -->
    <rect x="0" y="362" width="275" height="24" rx="4" fill="#0a0d14" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
    <circle cx="12" cy="374" r="3" fill="#38bdf8" class="live-dot" />
    <text x="22" y="377.5" fill="#8b949e" font-size="8.5" font-weight="600">STATUS: VERIFIED // ARCHITECT</text>
    <text x="232" y="377.5" fill="#38bdf8" font-size="8.5" font-weight="700">ACTIVE</text>
  </g>

