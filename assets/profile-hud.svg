    <text x="48" y="201.6" class="ascii-row" xml:space="preserve">             ''.  .,~tCC!i~~+!tLCCf!GLt     </text>
    <text x="48" y="210.8" class="ascii-row" xml:space="preserve">     ;              .!00f;`' :~~fGCC0GL     </text>
    <text x="48" y="220.0" class="ascii-row" xml:space="preserve">     `        ``,;.  !08Gf+~+fCGGGCtC0L     </text>
    <text x="48" y="229.2" class="ascii-row" xml:space="preserve">     +    .`;:::~~:'.iG888GLLCG000GftGt     </text>
    <text x="48" y="238.4" class="ascii-row" xml:space="preserve">      `    `~!tfti;''iG88880008888GGCG      </text>
    <text x="48" y="247.6" class="ascii-row" xml:space="preserve">      i    ';itfti`'`!0@80GCG08@88GC0f      </text>
