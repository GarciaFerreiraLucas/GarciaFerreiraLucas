  <g transform="translate(355, 52)">
    <!-- Header -->
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">SYSTEM.INFO</text>

    <!-- Email Highlight Pill (Matches Screenshot 1 & 2) -->
    <rect x="0" y="10" width="200" height="18" rx="4" fill="rgba(99, 102, 241, 0.22)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <text x="10" y="22.5" fill="#c084fc" font-size="9.5" font-weight="700">englucas.garcia@proton.me</text>

    <!-- Specs List with Dotted Leaders (Exact Monospace Alignment) -->
