<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%" style="background:#090a10; border-radius:10px; font-family:'JetBrains Mono','Fira Code','Courier New',monospace;">
  <defs>
    <!-- Cyan & Purple Glow -->
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scan-laser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <pattern id="terminal-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="0.75" />
    </pattern>

    <style>
      /* Laser scan sweeping across ASCII face */
      @keyframes laserScan {
        0% { transform: translateY(0px); opacity: 0.25; }
        50% { transform: translateY(265px); opacity: 1; }
        100% { transform: translateY(0px); opacity: 0.25; }
      }

      /* Stack cycling */
      @keyframes cycleStack1 { 0%, 22% { opacity: 1; transform: translateY(0); } 25%, 100% { opacity: 0; transform: translateY(-4px); } }
      @keyframes cycleStack2 { 0%, 24% { opacity: 0; transform: translateY(4px); } 26%, 48% { opacity: 1; transform: translateY(0); } 51%, 100% { opacity: 0; transform: translateY(-4px); } }
      @keyframes cycleStack3 { 0%, 49% { opacity: 0; transform: translateY(4px); } 51%, 73% { opacity: 1; transform: translateY(0); } 76%, 100% { opacity: 0; transform: translateY(-4px); } }
      @keyframes cycleStack4 { 0%, 74% { opacity: 0; transform: translateY(4px); } 76%, 97% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-4px); } }

      /* ASCII art row styling */
      .ascii-row {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 7.2px;
        fill: #c084fc;
        letter-spacing: 0.8px;
        white-space: pre;
      }

      .laser-beam {
        animation: laserScan 3.5s infinite ease-in-out;
      }
      .cursor-blink {
        animation: blink 0.9s infinite;
      }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .live-dot {
        animation: pulse 1.8s infinite ease-in-out;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="1.5" y="1.5" width="937" height="477" rx="10" fill="#090a10" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />

  <!-- macOS Window Header Bar -->
  <path d="M 1.5 11 Q 1.5 1.5 11 1.5 L 929 1.5 Q 938.5 1.5 938.5 11 L 938.5 35 L 1.5 35 Z" fill="#0d1017" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1" />

  <!-- Window Control Buttons (Red, Yellow, Green) -->
  <circle cx="20" cy="18" r="5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="5" fill="#27c93f" />

  <!-- Title -->
  <text x="470" y="22" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="600" letter-spacing="0.5">
    englucas.garcia@proton.me ~ lucas.profile.sh --live
  </text>

  <!-- Live Status Indicator -->
  <g transform="translate(865, 12)">
    <circle cx="0" cy="6" r="3.5" fill="#10b981" class="live-dot" />
    <text x="9" y="9.5" fill="#34d399" font-size="9.5" font-weight="700" letter-spacing="1">LIVE</text>
  </g>

  <!-- ======================================================= -->
  <!-- LEFT COLUMN: VISUAL.MAP (100% PURE ASCII ART FACE)      -->
  <!-- ======================================================= -->
  
  <g transform="translate(38, 52)">
    <!-- Header -->
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">VISUAL.MAP</text>
    <circle cx="78" cy="-3.5" r="3" fill="#38bdf8" class="live-dot" />

    <!-- ASCII Face Frame Container -->
    <rect x="0" y="10" width="275" height="285" rx="6" fill="#05060a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <rect x="0" y="10" width="275" height="285" rx="6" fill="url(#terminal-grid)" />

    <!-- Corner Brackets (Exact Reference ┌ ┐ └ ┘) -->
    <path d="M -2 26 L -2 8 L 16 8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 277 26 L 277 8 L 259 8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M -2 279 L -2 297 L 16 297" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 277 279 L 277 297 L 259 297" fill="none" stroke="#38bdf8" stroke-width="2" />

    <!-- Clip Path for Inside the ASCII Frame -->
    <clipPath id="ascii-frame-clip">
      <rect x="1" y="11" width="273" height="283" rx="5" />
    </clipPath>

    <g clip-path="url(#ascii-frame-clip)">
