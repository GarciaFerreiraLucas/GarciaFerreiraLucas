    <text x="48" y="174.0" class="ascii-row" xml:space="preserve">      +     .,;+!tLCGG00888@@@80GL' ;       </text>
    <text x="48" y="183.2" class="ascii-row" xml:space="preserve">       .    .:~+itfCGGG0088@@800GC;         </text>
