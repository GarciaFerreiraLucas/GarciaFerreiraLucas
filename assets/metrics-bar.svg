<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 75" width="100%" height="100%" style="background:transparent; font-family:'JetBrains Mono','Fira Code','Courier New',monospace;">
  <defs>
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Metric 1: Repositories & Systems -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="298" height="72" rx="8" fill="#090a10" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="149" y="36" fill="#f8fafc" font-size="24" font-weight="800" text-anchor="middle">15+</text>
    <text x="149" y="55" fill="#64748b" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">SISTEMAS EM PRODUÇÃO</text>
  </g>

  <!-- Metric 2: SLA & Availability with Circular Dial (Matches Screenshot center dial!) -->
  <g transform="translate(321, 0)">
    <rect x="0" y="0" width="298" height="72" rx="8" fill="#090a10" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
    
    <!-- Center circle dial from screenshot -->
    <circle cx="149" cy="30" r="16" fill="none" stroke="#1e293b" stroke-width="3" />
    <circle cx="149" cy="30" r="16" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="80 20" stroke-linecap="round" />
    <circle cx="149" cy="14" r="2.5" fill="#22c55e" filter="url(#m-glow)" />
    <text x="149" y="35" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle">99.9%</text>

    <text x="149" y="58" fill="#64748b" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">DISPONIBILIDADE (SLA)</text>
  </g>

  <!-- Metric 3: Architecture & Engineering Standard -->
  <g transform="translate(642, 0)">
    <rect x="0" y="0" width="298" height="72" rx="8" fill="#090a10" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="149" y="36" fill="#f8fafc" font-size="24" font-weight="800" text-anchor="middle">100%</text>
    <text x="149" y="55" fill="#64748b" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">CLEAN ARCHITECTURE &amp; SOLID</text>
  </g>
</svg>